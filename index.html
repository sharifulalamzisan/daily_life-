<style>
/* Layout: one narrow column (phone-first, 560px max), sticky day header, fixed bottom tab bar.
   Palette: pre-dawn ink + minaret green for salah/jamaat + dawn amber for the day's one accent. */
:root{
  --bg:#F2F4F3; --surface:#FFFFFF; --sunk:#E7ECEA; --line:#D5DDD9;
  --fg:#15201D; --muted:#5C6B66; --faint:#8A9994;
  --green:#0E6B57; --green-soft:#D4EDE5;
  --dawn:#C4691C; --dawn-soft:#FBE7D3;
  --good:#1F8A4C; --good-soft:#DAF2E3; --warn:#B7791F; --warn-soft:#FBEFD5; --bad:#C0392B; --bad-soft:#F9DEDA;
  --night:#1B2B3A; --night-fg:#E9EEF2;
  --f-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1513; --surface:#16201D; --sunk:#1D2926; --line:#2A3834;
  --fg:#E6EEEB; --muted:#9AABA5; --faint:#6E7F7A;
  --green:#4FC2A2; --green-soft:#16362E; --dawn:#F0A15B; --dawn-soft:#3A2715;
  --good:#5BCB8A; --good-soft:#163424; --warn:#E7B55A; --warn-soft:#382B12; --bad:#F07B6E; --bad-soft:#3C1C18;
  --night:#0A1119; --night-fg:#DCE5EC; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E1513; --surface:#16201D; --sunk:#1D2926; --line:#2A3834;
  --fg:#E6EEEB; --muted:#9AABA5; --faint:#6E7F7A;
  --green:#4FC2A2; --green-soft:#16362E; --dawn:#F0A15B; --dawn-soft:#3A2715;
  --good:#5BCB8A; --good-soft:#163424; --warn:#E7B55A; --warn-soft:#382B12; --bad:#F07B6E; --bad-soft:#3C1C18;
  --night:#0A1119; --night-fg:#DCE5EC; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;margin:0}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 110px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
button{font:inherit;color:inherit}

.ring{--p:0;width:92px;height:92px;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--dawn) calc(var(--p)*1%), rgba(255,255,255,.14) 0)}

.now{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
.now .t{font-family:var(--f-mono);font-size:13px;color:var(--dawn);min-width:52px;padding-top:2px}
.now .w{font-weight:600}

.row{display:flex;align-items:center;gap:10px;min-height:40px}

.yn{border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:7px 14px;min-width:74px;font-weight:700;font-size:13px;cursor:pointer}
.yn[data-v="Y"]{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.yn[data-v="N"]{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--sunk);overflow:hidden}
.step button{border:0;background:none;width:36px;height:36px;font-size:18px;cursor:pointer;color:var(--muted)}
.step input{width:56px;border:0;background:none;text-align:center;font-family:var(--f-mono);font-size:15px;color:var(--fg);-moz-appearance:textfield}
.step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=time]{border:1px solid var(--line);background:var(--sunk);color:var(--fg);border-radius:10px;padding:7px 8px;font-family:var(--f-mono);font-size:14px}
input.txt,textarea{width:100%;border:1px solid var(--line);background:var(--sunk);color:var(--fg);border-radius:10px;padding:9px 11px;font:inherit;font-size:14px}

.hint{font-size:12.5px;color:var(--muted);background:var(--sunk);border-radius:10px;padding:8px 10px}

.quick{border:1px dashed var(--green);color:var(--green);background:none;border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px;cursor:pointer}

/* score breakdown */
.checks{display:flex;flex-wrap:wrap;gap:6px}
.chk{font-size:12px;padding:4px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.chk.on{background:var(--good-soft);color:var(--good);border-color:var(--good)}

/* routine */
.seg{display:flex;gap:4px;background:var(--sunk);border-radius:12px;padding:4px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px;font-weight:600;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl li{display:grid;grid-template-columns:78px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.tl li:last-child{border-bottom:0}
.tl .t{font-family:var(--f-mono);font-size:13px;color:var(--muted);padding-top:1px}
.tl .w{font-weight:600}
.tl .y{font-size:13px;color:var(--muted)}
.tl li.cur{background:var(--dawn-soft);margin-inline:-14px;padding-inline:14px;border-radius:10px}
.tl li.cur .t{color:var(--dawn);font-weight:700}

/* week */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--sunk);border-radius:12px;padding:10px}
.stat b{font-family:var(--f-mono);font-size:19px;display:block}
.stat small{font-size:11.5px;color:var(--muted)}
.reward{border-radius:var(--r);padding:14px;display:flex;gap:12px;align-items:center}

.reward.no{background:var(--warn-soft);border:1px solid var(--warn)}
.reward.wait{background:var(--sunk);border:1px solid var(--line)}
.reward h3{font-size:17px}
.reward p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:6px;height:120px;padding-top:6px;border-bottom:1px solid var(--line)}
.bars .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;min-width:0}
.bars .b i{display:block;width:100%;border-radius:6px 6px 2px 2px;background:var(--green)}
.bars .b i.low{background:var(--warn)}
.bars .b i.cur{background:var(--dawn)}
.bars .b span{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.blabels{display:flex;gap:6px}
.blabels span{flex:1;text-align:center;font-size:10.5px;color:var(--faint);font-family:var(--f-mono)}
.wkbtn{display:flex;align-items:center;gap:8px}
.wkbtn button{border:1px solid var(--line);background:var(--surface);border-radius:9px;width:34px;height:34px;cursor:pointer;font-size:17px}
.wkbtn h2{font-size:18px;flex:1}
table.days{width:100%;border-collapse:collapse;font-size:13px}
table.days th,table.days td{padding:6px 4px;text-align:center;border-bottom:1px solid var(--line)}
table.days th{font-size:11px;color:var(--muted);font-weight:600}
table.days td:first-child,table.days th:first-child{text-align:left}
.tscroll{overflow-x:auto}

/* plan */
.plan li{grid-template-columns:52px 1fr}
.plan li.cur{background:var(--dawn-soft)}
.set-grid{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center}
.set-grid input{width:84px;border:1px solid var(--line);background:var(--sunk);color:var(--fg);border-radius:9px;padding:7px 8px;font-family:var(--f-mono);text-align:right}
.rules{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;z-index:9}
@media (prefers-reduced-motion:no-preference){.ring{transition:background .4s}}

  writeQueues[path] = prev.then(() => S.db.doc(path).set(data)).then(
    () => setSync("Saved"),
    e => setSync(e && e.code==="quota_exceeded" ? "Storage full" : "Not saved — check connection"));
}
const timers = {};
function persistSoon(path, getData, ms=700){
  clearTimeout(timers[path]);
  timers[path] = setTimeout(() => persist(path, getData()), ms);
}
function setSync(t){ $("#sync").textContent = t; }

/* ---------------- scoring (mirrors the spreadsheet) ---------------- */
function sleepHrs(L){ const b=toMin(L.bed), w=toMin(L.wake); if(b==null||w==null) return null; return (((w-b)%1440)+1440)%1440/60; }
function hasInput(L){
  if(!L) return false;
  return Object.entries(L).some(([k,v]) => !["learned","topic","note","updated"].includes(k) && v!=="" && v!=null);
}
function score(L, key){
  if(!hasInput(L)) return null;
  const st = S.settings, fast = isFast(fromKey(key));
  const sal = PRAYERS.map(p=>L[p[0]]||"");
  const jam = sal.filter(v=>v==="J").length, prayed = sal.filter(v=>v==="J"||v==="A").length;
  const sh = sleepHrs(L), w = toMin(L.wake);
  const items = [
    ["Woke on time", w!=null && w <= toMin(st.wake)+5, 1],
    ["Slept enough", sh!=null && sh >= st.sleep, 1],
    ["Salah on time", null, prayed/5],
    ["Jamaat", null, jam/5],
    ["Dua", L.dua==="Y", 1], ["Islamic learning", L.ilearn==="Y", 1],
    ["Exercise", (+L.run||0)>0 || (+L.pushups||0)>0, 1],
    ["Proper food", (+L.meals||0) >= (fast?st.mealsFast:st.meals) && L.protein==="Y", 1],
    ["Water", (+L.water||0) >= st.water, 1],
    ["Deep study", (+L.study||0) >= st.study, 1],
    ["Writing", L.writing==="Y", 1], ["Reading", (+L.pages||0)>0, 1],
    ["Phone rule", L.phone==="Y", 1], ["No games", L.nogame==="Y", 1],
    ["Sadaqah", (+L.sadaqah||0) >= st.sadaqah, 1],
  ];
  if(fast) items.push(["Fasted", L.fasted==="Y", 1]);
  let pts = 0;
  const checks = items.map(([n,ok,v]) => { const got = ok===null ? v : (ok?1:0); pts += got; return [n, ok===null ? v>=1 : ok, ok===null ? v : null]; });
  return { value: pts / (fast?16:15), checks, jam, prayed, sleep: sh };
}

/* ---------------- week stats ---------------- */
function weekStats(start){
  const st = S.settings, today = todayKey();
  const out = {days:[], logged:0, sum:0, jam:0, prayed:0, ontime:0, sleepSum:0, sleepN:0, runs:0, km:0, longest:0, push:0, study:0, writing:0, pages:0, mono:0, fasts:0, fastDue:0, phone:0, games:0, sad:0, waste:0};
  for(let i=0;i<7;i++){
    const d = addDays(start,i), k = keyOf(d), L = S.logs[k], sc = score(L,k);
    out.days.push({d,k,L,sc});
    if(isFast(d) && k<=today) out.fastDue++;
    if(!sc) continue;
    out.logged++; out.sum += sc.value; out.jam += sc.jam; out.prayed += sc.prayed;
    if(L.wake && toMin(L.wake) <= toMin(st.wake)+5) out.ontime++;
    if(sc.sleep!=null){ out.sleepSum+=sc.sleep; out.sleepN++; }
    const km = +L.run||0; if(km>0) out.runs++; out.km += km; out.longest = Math.max(out.longest, km);
    out.push += +L.pushups||0; out.study += +L.study||0; out.pages += +L.pages||0;
    if(L.writing==="Y") out.writing++; if(L.mono==="Y") out.mono++; if(L.fasted==="Y") out.fasts++;
    if(L.phone==="Y") out.phone++; if(L.nogame==="Y") out.games++;
    out.sad += +L.sadaqah||0; out.waste += +L.waste||0;
  }
  out.avg = out.logged ? out.sum/out.logged : null;
  out.jamPct = out.jam/35;
  out.reward = out.logged<5 ? "wait" : (out.avg>=st.rewardScore && out.jamPct>=st.rewardJam ? "yes" : "no");
  return out;
}

    <div class="sec"><header><h2>Running to 3 km</h2><span class="pts">4–5 days a week, never on fast days</span></header>
      <ol class="tl plan">${RUNPLAN.map(r=>`<li class="${+r[0]===+st.runWeek?"cur":""}"><span class="t">Wk ${r[0]}</span><div><div class="w">${r[1]}</div>${r[2]?`<div class="y">${r[2]}</div>`:""}</div></li>`).join("")}</ol>
      <div class="row"><div class="lab"><b>I'm on week</b><small>Repeat a week if it felt too hard or shins hurt</small></div>${`<div class="step"><button data-runwk="-1" aria-label="Previous plan week">−</button><input class="num" readonly value="${st.runWeek}" aria-label="Plan week" style="width:44px"><button data-runwk="1" aria-label="Next plan week">+</button></div>`}</div>
    </div>

    <div class="sec"><header><h2>Push-ups</h2></header>
      <div class="hint">3 sets a day, each stopping about 2 reps before failure. Add 1–2 reps per set each week. Fewer than 5 clean reps: start with incline push-ups (hands on the bed or table). Log the daily total.</div>
    </div>

    <div class="sec"><header><h2>Food: strong, not skinny</h2><span class="pts">affordable, Bangladesh</span></header>
      <ol class="tl">
        <li><span class="t">Breakfast</span><div><div class="w">2 eggs + 2 roti, or oats with milk + banana</div></div></li>
        <li><span class="t">Lunch</span><div><div class="w">Rice + dal + fish, chicken or egg + vegetable</div><div class="y">Take a full plate of rice. Carbs fuel running and study.</div></div></li>
        <li><span class="t">Snack</span><div><div class="w">Muri or chira with peanuts, banana, curd, or milk</div><div class="y">Replaces chips, soft drinks and random fast food.</div></div></li>
        <li><span class="t">Dinner</span><div><div class="w">Rice or roti + dal + protein + vegetable</div></div></li>
        <li><span class="t">Guard</span><div><div class="w">Friday weight falls two weeks running → add milk + banana + peanuts daily</div></div></li>
        <li><span class="t">Money</span><div><div class="w">Necessary → Healthy → Productive → Everything else</div></div></li>
      </ol>
    </div>

    <div class="sec"><header><h2>Rules</h2></header>
      <ol class="rules">
        <li>Keep it simple. This page is the whole system.</li>
        <li>Protect sleep. Never fix a bad week with an all-nighter.</li>
        <li>Never miss twice. One bad day is noise; two is a new habit.</li>
        <li>Recovery — food, sleep, nap, reward — is part of discipline.</li>
        <li>eFootball stays deleted. If you reinstall it, log it and write why.</li>
        <li>Track execution, not intentions.</li>
      </ol>
    </div>

    <div class="sec"><header><h2>Targets</h2><span class="pts">scores update instantly</span></header>
      <div class="set-grid">
        ${field("wake","Wake-up time")}${field("sleep","Night sleep target (h)",0.5)}${field("study","Deep study target (h)",0.5)}
        ${field("water","Water target (glasses)",1)}${field("meals","Meals, normal day",1)}${field("mealsFast","Meals, fast day",1)}
        ${field("sadaqah","Daily sadaqah (৳)",5)}${field("rewardScore","Reward: min avg score (%)",5)}${field("rewardJam","Reward: min jamaat (%)",5)}${field("mono","Monologues per week",1)}
      </div>
    </div>
  </section>`;
}
function saveSettings(){ persistSoon("meta/settings", () => ({...S.settings})); }

/* ---------------- render + events ---------------- */
function render(){
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab===S.tab));
  ({today:renderToday, routine:renderRoutine, week:renderWeek, plan:renderPlan})[S.tab]();
}
document.querySelector(".tabs").addEventListener("click", e => {
  const b = e.target.closest("[data-tab]"); if(!b) return;
  S.tab = b.dataset.tab; if(S.tab==="today") S.day = S.day || todayKey();
  try{ history.replaceState(null,"","#"+S.tab); }catch(_){}
  render(); window.scrollTo({top:0});
});

app.addEventListener("click", e => {
  const t = e.target.closest("button"); if(!t) return;
  const L = getLog(S.day);
  if(t.dataset.daynav){ const n=t.dataset.daynav; S.day = n==="0" ? todayKey() : keyOf(addDays(fromKey(S.day), +n)); render(); window.scrollTo({top:0}); return; }
  if(t.dataset.sal){ const f=t.dataset.sal, i=SAL_CYCLE.indexOf(L[f]||""), v=SAL_CYCLE[(i+1)%SAL_CYCLE.length]; L[f]=v; t.dataset.v=v; t.querySelector(".v").textContent=SAL_TXT[v]; saveDay(); refreshScore(); return; }
  if(t.dataset.yn){ const f=t.dataset.yn, v = L[f]==="Y"?"N":L[f]==="N"?"":"Y"; L[f]=v; t.dataset.v=v; t.textContent = v==="Y"?"✓ Yes":v==="N"?"✕ No":"Tap"; saveDay(); refreshScore(); return; }
  if(t.dataset.inc || t.dataset.dec){ const f=t.dataset.inc||t.dataset.dec, s=+t.dataset.s, dir=t.dataset.inc?1:-1;
    const v = Math.max(0, Math.round(((+L[f]||0) + dir*s)*10)/10); L[f]=v; app.querySelector(`#in-${f}`).value=v; saveDay(); refreshScore(); return; }
  if(t.dataset.quick){ L.sadaqah = (+L.sadaqah||0) + S.settings.sadaqah; saveDay(); render(); toast("Sadaqah logged"); return; }
  if(t.dataset.routine){ S.routine = t.dataset.routine; render(); return; }
  if(t.dataset.wk){ S.weekOffset = Math.min(0, S.weekOffset + +t.dataset.wk); render(); return; }
  if(t.dataset.open){ S.day = t.dataset.open; S.tab="today"; render(); window.scrollTo({top:0}); return; }
  if(t.dataset.runwk){ S.settings.runWeek = Math.min(8, Math.max(1, (+S.settings.runWeek||1) + +t.dataset.runwk)); saveSettings(); render(); return; }
});
app.addEventListener("input", e => {
  const el = e.target, L = getLog(S.day);
  if(el.dataset.num){ L[el.dataset.num] = el.value==="" ? "" : Math.max(0, +el.value); saveDay(); refreshScore(); }
  else if(el.dataset.time){ L[el.dataset.time] = el.value; saveDay(); refreshScore(); }
  else if(el.dataset.txt){ L[el.dataset.txt] = el.value; saveDay(); }
  else if(el.dataset.rv){ const ws = keyOf(addDays(weekStart(new Date()), 7*S.weekOffset)); (S.weeks[ws] ||= {})[el.dataset.rv] = el.value; S.weeks[ws].updated = new Date().toISOString(); persistSoon("weeks/"+ws, () => ({...S.weeks[ws]}), 900); }
  else if(el.dataset.set){ const k=el.dataset.set; if(el.value==="") return; S.settings[k] = k==="wake" ? el.value : (k==="rewardScore"||k==="rewardJam") ? (+el.value)/100 : +el.value; saveSettings(); }
});

/* ---------------- boot ---------------- */
function loadLocal(){
  const idx = LS.get("index") || [];
  for(const k of idx){ const v = LS.get("logs/"+k); if(v) S.logs[k]=v; }
  const s = LS.get("meta/settings"); if(s) S.settings = {...DEFAULTS, ...s};
}
const origPersist = persist;
// keep a local index of days so the offline fallback can reload them
persist = function(path, data){ if(path.startsWith("logs/")){ const idx = new Set(LS.get("index")||[]); idx.add(path.slice(5)); LS.set("index",[...idx]); } origPersist(path, data); };

const h = (location.hash||"").slice(1); if(["today","routine","week","plan"].includes(h)) S.tab = h;
loadLocal();
render();
setSync("Offline mode");

(async () => {
  let db = null;
  try{ db = window.claude && await window.claude.use("db"); }catch(_){ db = null; }
  if(!db){ setSync("Saved on this device only"); return; }
  S.db = db;
  setSync("Syncing…");
  let first = {logs:true, weeks:true};
  const dirty = path => timers[path] && true;
  db.collection("logs").onSnapshot(snap => {
    let touchesOpenDay = false;
    snap.docChanges().forEach(ch => {
      const k = ch.doc.id;
      if(ch.type==="removed"){ delete S.logs[k]; return; }
      if(k===S.day && !first.logs){ if(ch.doc.metadata.hasPendingWrites) return; touchesOpenDay = true; }
      S.logs[k] = {...ch.doc.data()};
    });
    setSync("Synced");
    // avoid re-rendering the form under the user's fingers
    const typing = document.activeElement && app.contains(document.activeElement) && /INPUT|TEXTAREA/.test(document.activeElement.tagName);
    if(first.logs || S.tab!=="today" || (touchesOpenDay && !typing)) render();
    first.logs = false;
  }, e => setSync("Sync stopped — reload to reconnect"));
  db.collection("weeks").onSnapshot(snap => {
    snap.docs.forEach(d => { S.weeks[d.id] = {...d.data()}; });
    const typing = document.activeElement && /TEXTAREA|INPUT/.test(document.activeElement.tagName);
    if(S.tab==="week" && !typing) render();
    first.weeks = false;
  }, () => {});
  db.doc("meta/settings").onSnapshot(d => {
    if(d.exists){ S.settings = {...DEFAULTS, ...d.data()}; if(S.tab!=="plan") render(); }
  }, () => {});
})();

// refresh the "Right now" card every minute on Today
setInterval(() => { if(S.tab==="today" && S.day===todayKey()){ const typing = document.activeElement && app.contains(document.activeElement) && /INPUT|TEXTAREA/.test(document.activeElement.tagName); if(!typing){ const y=window.scrollY; render(); window.scrollTo({top:y}); } } }, 60000);
})();
</script>

</body></html>
